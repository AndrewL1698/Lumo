<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Luci</title>
    <!-- Luci look: the web app's night panel (web/app/globals.css, dark tokens). Contrast on --bg:
         ink 15:1, muted 9:1, go 11:1, stop 8:1; dark text on the amber button 11:1 (all AA).
         Every id below is used by index.ts (Andrew's D-019 popup): keep them when changing the layout. -->
    <style>
      :root {
        --bg: #0f1a2c;
        --panel: #16233a;
        --ink: #f4efe3;
        --muted: #b8c3d4;
        --line: rgb(214 225 240 / 0.14);
        --amber: #f5c94a;
        --amber-line: rgb(255 210 58 / 0.32);
        --on-amber: #0f1a2c;
        --go: #7fdca3;
        --stop: #ff958b;
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      /* Chrome caps a popup at 600px tall. Past that a classic scrollbar ate ~15px of the 320px width and
         pushed the cards against the right edge. So: no scrollbar gutter (it still scrolls with wheel or
         trackpad), never scroll sideways, and keep the paired view under 600px. */
      html {
        overflow-x: hidden;
        scrollbar-width: none;
        background: #0f1a2c;
      }
      html::-webkit-scrollbar { display: none; }
      body {
        position: relative;
        width: 340px;
        margin: 0;
        padding: 14px 16px 44px; /* equal sides; room at the bottom for the grass */
        overflow: hidden;
        /* the web app's painted night (web/app/globals.css .night-sky-paint): slate sky, navy middle, moss at the ground */
        background:
          radial-gradient(120% 40% at 20% 0%, rgb(58 82 102 / 0.55), transparent 60%),
          radial-gradient(90% 35% at 85% 6%, rgb(44 66 88 / 0.45), transparent 65%),
          radial-gradient(140% 22% at 50% 102%, rgb(40 58 40 / 0.9), transparent 70%),
          linear-gradient(180deg, #2a3f52 0%, #1b2a40 22%, #121c33 46%, #111b2c 70%, #15231f 90%, #1a2a1f 100%);
        color: var(--ink);
        font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      p { margin: 0; overflow-wrap: anywhere; }
      [hidden] { display: none !important; }
      button, input { font: inherit; }
      :focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

      /* ---- background art: decorative, behind everything, never clickable ---- */
      .sky-art { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
      .sky-art .glow {
        position: absolute;
        width: 4px;
        height: 4px;
        border-radius: 999px;
        background: #fff4be;
        box-shadow: 0 0 6px 2px rgb(255 222 120 / 0.55), 0 0 16px 6px rgb(255 205 70 / 0.18);
      }
      .sky-art .glow.big { width: 5px; height: 5px; box-shadow: 0 0 8px 3px rgb(255 222 120 / 0.6), 0 0 26px 11px rgb(255 205 70 / 0.2); }
      .sky-art .grass { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 72px; }
      header, .chips, .card { position: relative; z-index: 1; }

      header { display: flex; align-items: center; gap: 8px; }
      header h1 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: -0.01em; }
      #open-app {
        margin-left: auto;
        color: var(--amber);
        text-decoration: none;
        font-weight: 600;
        border-radius: 4px;
      }
      #open-app:hover { text-decoration: underline; text-underline-offset: 3px; }

      .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
      .chip {
        display: inline-flex;
        align-items: center;
        padding: 2px 9px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgb(14 24 42 / 0.7); /* on the bare sky the red chip text was 4.4:1; on this it's 7:1+ */
        color: var(--muted);
        font-size: 12px;
      }
      .chip.ok { color: var(--go); border-color: rgb(127 220 163 / 0.35); }
      .chip.warn { color: var(--stop); border-color: rgb(255 149 139 / 0.35); }

      .card {
        margin-top: 12px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: rgb(14 24 42 / 0.8); /* the web app's translucent navy panel */
        -webkit-backdrop-filter: blur(6px);
        backdrop-filter: blur(6px);
      }
      .label {
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      .site { margin-top: 2px; font-size: 15px; font-weight: 600; }
      .note { margin-top: 6px; color: var(--muted); font-size: 12px; }
      .note:empty { display: none; }

      .primary {
        width: 100%;
        margin-top: 10px;
        padding: 9px 12px;
        border: 0;
        border-radius: 6px;
        background: var(--amber);
        color: var(--on-amber);
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 0 14px rgb(255 210 58 / 0.25);
        transition: filter 0.15s, box-shadow 0.15s;
      }
      .primary:hover { filter: brightness(1.06); box-shadow: 0 0 18px rgb(255 210 58 / 0.4); }
      .primary:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
      .secondary {
        width: 100%;
        margin-top: 8px;
        padding: 8px 12px;
        border: 1px solid var(--amber-line);
        border-radius: 6px;
        background: transparent;
        color: var(--ink);
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.15s, border-color 0.15s;
      }
      .secondary:hover { background: rgb(255 210 58 / 0.1); border-color: var(--amber); }
      .secondary:disabled { opacity: 0.4; cursor: not-allowed; }
      .secondary.is-on,
      .primary.is-on {
        background: transparent;
        color: var(--go);
        border: 1px solid rgb(127 220 163 / 0.4);
        box-shadow: none;
      }


      /* new-site nudge (D-017): a warm card on a recommended site */
      #nudge {
        margin-top: 10px;
        padding: 10px 12px 12px;
        border: 1px solid var(--amber-line);
        border-radius: 8px;
        background: rgb(255 210 58 / 0.08);
      }
      #nudge p { color: var(--ink); }
      #nudge .primary { margin-top: 8px; }
      /* when the nudge shows, its "Turn on" is the one main button; "Try on this page" steps back */
      .card:has(#nudge:not([hidden])) #try {
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--amber-line);
        box-shadow: none;
        font-weight: 600;
      }
      #imm-line { font-weight: 600; }
      .seg { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
      .seg > span { width: 52px; flex: none; color: var(--muted); font-size: 12px; }
      .seg-group { display: flex; flex: 1; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
      /* the dial buttons are created by index.ts inside #imm-rates / #imm-jumps */
      .seg-group button {
        flex: 1;
        padding: 4px 0;
        border: 0;
        border-left: 1px solid var(--line);
        background: transparent;
        color: var(--ink);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        cursor: pointer;
      }
      .seg-group button:first-child { border-left: 0; }
      .seg-group button:hover { background: rgb(255 210 58 / 0.12); }
      .seg-group button.active { background: var(--amber); color: var(--on-amber); font-weight: 700; }
      .seg-group button:focus-visible { outline-offset: -2px; }
      #imm-reset {
        margin-top: 8px;
        padding: 0;
        border: 0;
        background: none;
        color: var(--muted);
        font-size: 12px;
        text-decoration: underline;
        text-underline-offset: 3px;
        cursor: pointer;
      }
      #imm-reset:hover { color: var(--ink); }

      .pair-row { display: flex; gap: 6px; margin-top: 6px; }
      #code {
        flex: 1;
        min-width: 0;
        padding: 7px 9px;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: rgb(8 14 26 / 0.6);
        color: var(--ink);
        letter-spacing: 0.2em;
        font-variant-numeric: tabular-nums;
      }
      #code::placeholder { color: rgb(184 195 212 / 0.7); letter-spacing: 0.2em; }
      #pair {
        padding: 7px 14px;
        border: 0;
        border-radius: 6px;
        background: var(--amber);
        color: var(--on-amber);
        font-weight: 700;
        cursor: pointer;
      }
      #pair:disabled { opacity: 0.5; cursor: wait; }

      /* ---- the wandering firefly (firefly.ts moves it; the same artwork as the web app's cursor) ---- */
      .popup-fly {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 5;
        width: 24px;
        height: 24px;
        pointer-events: none;
        will-change: transform;
      }
      .popup-fly svg { display: block; width: 100%; height: 100%; overflow: visible; }
      .popup-fly .ff-wing { transform-box: fill-box; animation: ff-flap-l 150ms ease-in-out infinite alternate; }
      .popup-fly .ff-wing-l { transform-origin: 90% 85%; }
      .popup-fly .ff-wing-r { transform-origin: 10% 85%; animation-name: ff-flap-r; }
      .popup-fly[data-resting] .ff-wing { animation-duration: 600ms; } /* slow, lazy wings while it sits */
      .popup-fly .ff-tail { fill: #ffd23a; }
      .popup-fly .ff-halo { animation: ff-pulse 2.6s ease-in-out infinite; }
      @keyframes ff-flap-l { to { transform: rotate(-14deg) scaleY(0.6); } }
      @keyframes ff-flap-r { to { transform: rotate(14deg) scaleY(0.6); } }
      @keyframes ff-pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 0.85; } }

      @media (prefers-reduced-motion: reduce) {
        * { transition: none !important; }
        /* the firefly sits on the logo: no flutter, a steady soft glow */
        .popup-fly .ff-wing, .popup-fly .ff-halo { animation: none !important; }
        .popup-fly .ff-halo { opacity: 0.6; }
      }
    </style>
  </head>

      <p id="imm-line">Immersion …</p>

      <div class="seg">

        <div class="seg-group" id="imm-jumps" role="group" aria-labelledby="imm-jumps-label"></div>
      </div>
      <button id="imm-reset">Reset progress</button>
      <p id="imm-note" class="note"></p>
    </section>

    <section class="card" id="pairing" hidden>
      <label class="label" for="code">Pair with the web app</label>
      <p class="note">Enter the 6-digit code from Luci's setup page.</p>
      <div class="pair-row">
        <input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="123456" autocomplete="off" />
        <button id="pair">Pair</button>
      </div>
      <p id="pair-result" class="note" role="status"></p>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
