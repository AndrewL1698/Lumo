<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Luci</title>
    <style>
      body { width: 280px; margin: 8px; font-family: system-ui, sans-serif; font-size: 13px; }
      p { margin: 4px 0; overflow-wrap: anywhere; }
      section { margin-top: 10px; }
      #swaps { border-top: 1px solid #ddd; padding-top: 8px; }
      #amount { width: 100%; }
      .muted { color: #777; }
      #immersion { border-top: 1px solid #ddd; padding-top: 8px; }
      #immersion .row { margin: 6px 0; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
      #immersion button.active { font-weight: bold; outline: 2px solid #b8860b; }
    </style>
  </head>
  <body>
    <h3>Luci</h3>
    <p id="worker">worker: …</p>
    <p id="paired">paired: …</p>

    <section>
      <p>site: <span id="origin">…</span></p>
      <button id="enable" disabled>Enable on this site</button>
      <p id="enable-result"></p>
    </section>

    <section id="swaps">
      <label for="amount">Spanish words per page: <b id="amount-value">…</b></label>
      <input id="amount" type="range" min="0" max="200" step="1" />
      <label><input id="auto" type="checkbox" /> Grow automatically as you improve</label>
      <p id="amount-note" class="muted"></p>
    </section>

    <section id="immersion">
      <p id="imm-line">Immersion …</p>
      <div class="row" id="imm-rates"><span class="muted">Speed</span></div>
      <div class="row" id="imm-jumps"><span class="muted">Jump to</span></div>
      <div class="row"><button id="imm-reset">Reset progress</button></div>
      <p id="imm-note" class="muted"></p>
    </section>

    <section>
      <label for="code">Pairing code</label><br />
      <input id="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="123456" size="8" />
      <button id="pair">Pair</button>
      <p id="pair-result"></p>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
